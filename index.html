<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CAWS Monitoring Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="kualitas-row">
    <div class="status-box" id="cuaca-status">STATUS</div>
    <div id="last-update">Data terakhir diperbarui: …</div>
  </div>
  <div class="big-row">
    <div class="summary-card"><div>ANGIN</div><div id="wind-val">0.00</div><span>m/s</span></div>
    <div class="summary-card"><div>HUJAN</div><div id="rain-val">0.00</div><span>mm</span></div>
    <div class="summary-card"><div>CAHAYA</div><div id="light-val">0.00</div><span>lux</span></div>
  </div>
  <div class="chartbox">
    <h3>Tren Per Jam (24 Jam Terakhir)</h3>
    <canvas id="chart-hour"></canvas>
    <h3>Tren Harian (7 Hari Terakhir)</h3>
    <canvas id="chart-day"></canvas>
    <h3>Tren Bulanan (12 Bulan Terakhir)</h3>
    <canvas id="chart-month"></canvas>
  </div>
  <div class="rekap-panel">
    <h2>Rekap Data (Per Menit)</h2>
    <button onclick="downloadCSV()">Download CSV</button>
    <table id="data-table">
      <thead>
        <tr><th>Waktu</th><th>Angin (m/s)</th><th>Hujan (mm)</th><th>Cahaya (lux)</th><th>Status</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</body>
</html>
