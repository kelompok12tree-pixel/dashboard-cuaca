<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Cuaca</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .data-card {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #dee2e6;
        }
        .data-value {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }
        .data-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .status.connected {
            background-color: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Monitoring Cuaca</h1>
        <div id="status" class="status disconnected">Menghubungkan ke Firebase...</div>
        <div class="data-grid">
            <div class="data-card">
                <div class="data-value" id="angin">--</div>
                <div class="data-label">Kecepatan Angin (m/s)</div>
            </div>
            <div class="data-card">
                <div class="data-value" id="hujan">--</div>
                <div class="data-label">Curah Hujan (mm)</div>
            </div>
            <div class="data-card">
                <div class="data-value" id="cahaya">--</div>
                <div class="data-label">Intensitas Cahaya (lx)</div>
            </div>
            <div class="data-card">
                <div class="data-value" id="waktu">--</div>
                <div class="data-label">Waktu Terakhir Update</div>
            </div>
        </div>
        <div class="loading" id="loading">Memuat data...</div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCcTrvQyf5g2AAmHOLuXQeBbeR4hjGxYSw",
            authDomain: "monitoring-kel-12-default-rtdb.asia-southeast1.firebasedatabase.app",
            databaseURL: "https://monitoring-kel-12-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "monitoring-kel-12",
            storageBucket: "monitoring-kel-12.appspot.com",
            messagingSenderId: "123456789", // Ganti dengan ID yang benar jika ada
            appId: "1:123456789:web:abcdef123456" // Ganti dengan App ID yang benar jika ada
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Referensi ke data kondisi saat ini
        const kondisiRef = ref(database, '/KondisiSaatIni');

        // Fungsi untuk update status koneksi
        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            const loadingEl = document.getElementById('loading');
            if (connected) {
                statusEl.className = 'status connected';
                statusEl.textContent = 'Terhubung ke Firebase';
                loadingEl.style.display = 'none';
            } else {
                statusEl.className = 'status disconnected';
                statusEl.textContent = 'Terputus dari Firebase';
                loadingEl.style.display = 'block';
                loadingEl.textContent = 'Mencoba menghubungkan kembali...';
            }
        }

        // Fungsi untuk format waktu
        function formatWaktu(waktuStr) {
            if (!waktuStr) return '--';
            // Asumsikan format: DD/MM/YYYY HH:MM:SS
            return waktuStr;
        }

        // Fungsi untuk format angka
        function formatAngka(nilai, desimal = 2) {
            if (nilai === null || nilai === undefined) return '--';
            return parseFloat(nilai).toFixed(desimal);
        }

        // Listen untuk perubahan data
        onValue(kondisiRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                updateStatus(true);
                document.getElementById('angin').textContent = formatAngka(data.angin_mps);
                document.getElementById('hujan').textContent = formatAngka(data.hujan_mm);
                document.getElementById('cahaya').textContent = formatAngka(data.cahaya_lx, 1);
                document.getElementById('waktu').textContent = formatWaktu(data.waktu);
            } else {
                updateStatus(false);
            }
        }, (error) => {
            console.error('Error reading data:', error);
            updateStatus(false);
        });

        // Update status awal
        updateStatus(false);
    </script>
</body>
</html>
