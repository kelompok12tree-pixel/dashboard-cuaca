<!-- Tambah di bawah kartu nilai -->
<div class="mt-5">
  <h4 class="mb-3 text-center">Grafik Realtime Kondisi Saat Ini</h4>
  <canvas id="grafik-kondisi" height="120"></canvas>
</div>

<!-- CDN Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCcTrvQyf5g2AAmHOLuXQeBbeR4hjGxYSw",
    authDomain: "monitoring-kel-12.firebaseapp.com",
    databaseURL: "https://monitoring-kel-12-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "monitoring-kel-12",
    storageBucket: "monitoring-kel-12.appspot.com"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // Node kondisi saat ini
  const kondisiRef = ref(db, "/A_KondisiSaatIni");

  const ctx = document.getElementById("grafik-kondisi").getContext("2d");
  const maxPoints = 40; // jumlah titik maksimum di grafik

  const chartKondisi = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],  // waktu
      datasets: [
        {
          label: "Angin (m/s)",
          data: [],
          borderColor: "rgb(54, 162, 235)",
          backgroundColor: "rgba(54, 162, 235, 0.15)",
          tension: 0.25
        },
        {
          label: "Hujan (mm)",
          data: [],
          borderColor: "rgb(75, 192, 192)",
          backgroundColor: "rgba(75, 192, 192, 0.15)",
          tension: 0.25
        },
        {
          label: "Cahaya (lx)",
          data: [],
          borderColor: "rgb(255, 159, 64)",
          backgroundColor: "rgba(255, 159, 64, 0.15)",
          tension: 0.25,
          yAxisID: "y2"   // pakai axis kanan biar skala lux tidak ganggu
        }
      ]
    },
    options: {
      scales: {
        x: {
          ticks: { maxRotation: 0, autoSkip: true }
        },
        y: {
          title: { display: true, text: "Angin / Hujan" }
        },
        y2: {
          position: "right",
          grid: { drawOnChartArea: false },
          title: { display: true, text: "Cahaya (lx)" }
        }
      }
    }
  });

  onValue(kondisiRef, (snap) => {
    const data = snap.val();
    if (!data) return;

    const waktu  = data.waktu ?? "";
    const angin  = Number(data.angin_mps  ?? 0);
    const hujan  = Number(data.hujan_mm   ?? 0);
    const cahaya = Number(data.cahaya_lx  ?? 0);

    // tambah titik baru
    chartKondisi.data.labels.push(waktu);
    chartKondisi.data.datasets[0].data.push(angin);
    chartKondisi.data.datasets[1].data.push(hujan);
    chartKondisi.data.datasets[2].data.push(cahaya);

    // batasi jumlah titik
    if (chartKondisi.data.labels.length > maxPoints) {
      chartKondisi.data.labels.shift();
      chartKondisi.data.datasets.forEach(ds => ds.data.shift());
    }

    chartKondisi.update();
  });
</script>
