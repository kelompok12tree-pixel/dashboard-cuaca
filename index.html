<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Monitoring Cuaca - Data Per-Menit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <style>
    body { background: #f6f7fa; font-family: Arial, sans-serif;}
    table th, table td { font-size: 0.97rem; padding: 5px 7px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h2 class="mb-3 text-center">Data Per-Menit - Monitoring Cuaca</h2>

        <label for="tanggalPicker" class="mb-2">Pilih tanggal (YYYY-MM-DD):</label>
        <input type="date" id="tanggalPicker" class="form-control mb-3" />
        <button onclick="loadData()" class="btn btn-primary mb-3">Tampilkan Data</button>

        <table class="table table-bordered" id="tabelData">
          <thead>
            <tr>
              <th>Jam:Menit</th>
              <th>Angin (m/s)</th>
              <th>Hujan (mm)</th>
              <th>Cahaya (lx)</th>
              <th>Count</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="5" class="text-center">Silakan pilih tanggal untuk menampilkan data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    // Ganti dengan konfigurasi Firebase project kamu!
    var firebaseConfig = {
      apiKey: "AIzaSyCcTrvQyf5g2AAmHOLuXQeBbeR4hjGxYSw",
      databaseURL: "https://monitoring-kel-12-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    function loadData() {
      var tgl = document.getElementById('tanggalPicker').value;
      var tbody = document.getElementById("tabelData").querySelector("tbody");
      tbody.innerHTML = `<tr><td colspan="5" class="text-center">Memuat data...</td></tr>`;
      if (!tgl) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center">Tanggal belum dipilih.</td></tr>`;
        return;
      }
      var path = '/C_PerMenit/' + tgl;
      db.ref(path).once("value", function(snapshot) {
        tbody.innerHTML = "";
        if (!snapshot.exists()) {
          var row = tbody.insertRow();
          row.innerHTML = `<td colspan="5" class="text-center">Tidak ada data untuk tanggal ini.</td>`;
        } else {
          snapshot.forEach(function(childSnap) {
            var key = childSnap.key; // jam-menit
            var val = childSnap.val();
            var row = tbody.insertRow();
            row.insertCell(0).textContent = key;
            row.insertCell(1).textContent = Number(val.angin_rata2 ?? 0).toFixed(2);
            row.insertCell(2).textContent = Number(val.hujan_total_mm ?? 0).toFixed(2);
            row.insertCell(3).textContent = Number(val.cahaya_rata2 ?? 0).toFixed(2);
            row.insertCell(4).textContent = val.count ?? "-";
          });
        }
      });
    }
  </script>
</body>
</html>
