<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Monitoring Cuaca</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase CDN NON MODULE, PASTIKAN INI -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div style="max-width:820px;margin:16px auto 0 auto;">
    <h2 style="text-align:center;color:#c8feee;">Dashboard Monitoring Cuaca</h2>
    <div style="display:flex;gap:18px;justify-content:center;">
      <div style="background:#282848;padding:23px 32px;border-radius:13px;color:#36f8da;font-size:2.2em;" id="wind">-</div>
      <div style="background:#282848;padding:23px 32px;border-radius:13px;color:#fade62;font-size:2.2em;" id="rain">-</div>
      <div style="background:#282848;padding:23px 32px;border-radius:13px;color:#a1ff99;font-size:2.2em;" id="light">-</div>
    </div>
    <div style="display:flex;justify-content:space-between;color:#fade62;font-size:1.09em;margin:14px 30px;">
      <span id="waktu-update">Waktu: -</span>
      <span id="last-update">Data terakhir diperbarui: -</span>
    </div>
    <div style="background:#282848;border-radius:15px;box-shadow:0 0 18px #3337;padding:20px;margin:16px 0;">
      <h3 style="text-align:center;color:#a1ff99;">Grafik Sensor per Jam</h3>
      <canvas id="realtimeChart"></canvas>
    </div>
  </div>
</body>
</html>
